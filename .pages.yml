media:
  input: img
  output: /img
content:
  - name: site
    label: Isi Situs (berita, angka, logo)
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Nama lembaga
        type: string
      - name: lynk
        label: Link halaman Lynk
        type: string
      - name: logo
        label: Logo (kosongkan untuk ikon bawaan)
        type: image
      - name: showName
        label: Tampilkan nama di samping logo
        type: boolean
      - name: menu
        label: Menu di header (kosongkan untuk menu bawaan)
        type: object
        list: true
        fields:
          - name: label
            label: Nama menu
            type: string
          - name: url
            label: Link (contoh news.html atau https://lynk.id/...), kosongkan jika punya dropdown
            type: string
          - name: children
            label: Isi dropdown (opsional)
            type: object
            list: true
            fields:
              - name: label
                label: Nama
                type: string
              - name: url
                label: Link
                type: string
      - name: profile
        label: Halaman Profil
        type: object
        fields:
          - name: title
            label: Judul halaman
            type: string
          - name: intro
            label: Kalimat pembuka (opsional, kosongkan jika tidak perlu)
            type: text
          - name: sections
            label: Bagian profil
            type: object
            list: true
            fields:
              - name: heading
                label: Judul bagian
                type: string
              - name: text
                label: Isi (pisahkan paragraf dengan baris kosong)
                type: text
          - name: linksTitle
            label: Judul bagian tautan (contoh Hubungi kami)
            type: string
          - name: links
            label: Tautan WhatsApp, Instagram, dll
            type: object
            list: true
            fields:
              - name: type
                label: Jenis
                type: select
                options:
                  values: [WhatsApp, Instagram, Lainnya]
              - name: label
                label: Teks tombol (opsional)
                type: string
              - name: url
                label: Nomor WA (08xxx), @username Instagram, atau link lengkap
                type: string
      - name: program
        label: Halaman Program
        type: object
        fields:
          - name: title
            label: Judul halaman dan bagian beranda (contoh Program Kami)
            type: string
          - name: intro
            label: Kalimat pembuka halaman (opsional)
            type: text
          - name: donasiDesc
            label: Deskripsi Donasi (kosongkan untuk teks bawaan)
            type: text
          - name: donasiIcon
            label: Ikon Donasi (opsional)
            type: image
          - name: zakatDesc
            label: Deskripsi Zakat (kosongkan untuk teks bawaan)
            type: text
          - name: zakatIcon
            label: Ikon Zakat (opsional)
            type: image
          - name: sedekahDesc
            label: Deskripsi Sedekah (kosongkan untuk teks bawaan)
            type: text
          - name: sedekahIcon
            label: Ikon Sedekah (opsional)
            type: image
          - name: wakafDesc
            label: Deskripsi Wakaf (kosongkan untuk teks bawaan)
            type: text
          - name: wakafIcon
            label: Ikon Wakaf (opsional)
            type: image
          - name: cards
            label: Kartu program (gambar, judul, link Lynk)
            type: object
            list: true
            fields:
              - name: category
                label: Kategori
                type: select
                options:
                  values: [Donasi, Zakat, Sedekah, Wakaf]
              - name: title
                label: Judul kartu
                type: string
              - name: image
                label: Gambar
                type: image
              - name: url
                label: Link kampanye di Lynk
                type: string
      - name: footer
        label: Footer (bagian bawah situs)
        type: object
        fields:
          - name: description
            label: Kalimat deskripsi (kosongkan untuk kalimat bawaan)
            type: text
          - name: quickTitle
            label: Judul kolom tautan (contoh Tautan)
            type: string
          - name: donateText
            label: Tulisan link donasi (contoh Donasi sekarang)
            type: string
          - name: quick
            label: Tautan tambahan di footer
            type: object
            list: true
            fields:
              - name: label
                label: Nama tautan
                type: string
              - name: url
                label: Link (news.html, about.html, atau https://...)
                type: string
          - name: contactTitle
            label: Judul kolom kontak (contoh Kontak)
            type: string
          - name: address
            label: Alamat (boleh lebih dari satu baris)
            type: text
          - name: phone
            label: Nomor telepon
            type: string
          - name: email
            label: Email
            type: string
          - name: hours
            label: Jam layanan (contoh Senin-Jumat, 08.00-16.00)
            type: string
          - name: copyright
            label: Tulisan hak cipta (pakai {tahun} agar tahun otomatis)
            type: string
      - name: theme
        label: Tampilan (warna, huruf, ukuran tulisan)
        type: object
        fields:
          - name: palette
            label: Pilihan warna
            type: select
            options:
              values: [Hijau (bawaan), Biru, Ungu, Merah marun, Teal]
          - name: headingFont
            label: Huruf judul
            type: select
            options:
              values: [Bricolage Grotesque, Source Sans 3, Poppins, Montserrat, Nunito, Inter, Lora, Merriweather, Playfair Display]
          - name: bodyFont
            label: Huruf isi
            type: select
            options:
              values: [Bricolage Grotesque, Source Sans 3, Poppins, Montserrat, Nunito, Inter, Lora, Merriweather, Playfair Display]
          - name: textSize
            label: Ukuran tulisan
            type: select
            options:
              values: [Kecil, Normal, Besar, Sangat besar]
          - name: logoSize
            label: Ukuran logo di header
            type: select
            options:
              values: [Normal, Besar, Sangat besar]
          - name: pageWidth
            label: Lebar halaman
            type: select
            options:
              values: [Standar, Lebar, Sangat lebar]
          - name: forest
            label: "Warna utama gelap (opsional, contoh #0f3d2a)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #0f3d2a, atau kosongkan
          - name: leaf
            label: "Warna sekunder (opsional)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #2e8b57, atau kosongkan
          - name: sun
            label: "Warna tombol dan angka (opsional)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #f4b942, atau kosongkan
      - name: stats
        label: Angka slideshow di beranda
        type: object
        list: true
        fields:
          - name: label
            label: Judul angka
            type: string
          - name: value
            label: Nilai (angka saja, tanpa titik)
            type: number
          - name: money
            label: Tampilkan sebagai Rupiah
            type: boolean
      - name: news
        label: Kabar
        type: object
        list: true
        fields:
          - name: title
            label: Judul
            type: string
          - name: date
            label: Tanggal
            type: date
          - name: summary
            label: Ringkasan singkat (tampil di kartu)
            type: text
          - name: image
            label: Foto
            type: image
          - name: body
            label: Isi lengkap (pisahkan paragraf dengan baris kosong)
            type: text
          - name: source
            label: Nama sumber (opsional)
            type: string
          - name: sourceUrl
            label: Link berita asli (opsional)
            type: string
  - name: kalkulator
    label: Kalkulator Zakat (harga, tautan, doa)
    type: file
    path: data/kalkulator.json
    format: json
    fields:
      - name: judul
        label: Judul halaman
        type: string
      - name: intro
        label: Kalimat pembuka
        type: text
      - name: hargaEmas
        label: Harga emas per gram (angka saja, tanpa titik)
        type: number
      - name: hargaPerak
        label: Harga perak per gram (angka saja)
        type: number
      - name: hargaGabah
        label: Harga gabah per kg (angka saja, untuk nisab pertanian)
        type: number
      - name: hargaBeras
        label: Harga beras per kg (angka saja, untuk zakat fitrah)
        type: number
      - name: tanggalHarga
        label: Keterangan tanggal harga (contoh Diperbarui 17 November 2026)
        type: string
      - name: tombol
        label: Tulisan tombol (contoh Tunaikan Zakat)
        type: string
      - name: linkUmum
        label: Link umum tombol (kosongkan untuk memakai link Lynk utama)
        type: string
      - name: links
        label: Link Lynk untuk tiap jenis zakat (kosong = pakai link umum)
        type: object
        fields:
          - {name: emas, label: Zakat Emas, type: string}
          - {name: perak, label: Zakat Perak, type: string}
          - {name: uang, label: Zakat Uang, type: string}
          - {name: surat, label: Zakat Surat Berharga, type: string}
          - {name: niaga, label: Zakat Perniagaan, type: string}
          - {name: ikan, label: Zakat Perikanan, type: string}
          - {name: tambang, label: Zakat Pertambangan, type: string}
          - {name: perusahaan, label: Zakat Perusahaan, type: string}
          - {name: hasil, label: Zakat Penghasilan, type: string}
          - {name: tani, label: Zakat Pertanian, type: string}
          - {name: ternak, label: Zakat Peternakan, type: string}
          - {name: fitrah, label: Zakat Fitrah, type: string}
      - name: catatan
        label: Catatan di bawah kalkulator
        type: text
      - name: doaMaal
        label: Niat dan doa (zakat selain fitrah)
        type: object
        list: true
        fields:
          - {name: judul, label: Judul, type: string}
          - {name: arab, label: Tulisan Arab, type: text}
          - {name: latin, label: Tulisan latin, type: text}
          - {name: arti, label: Arti, type: text}
      - name: doaFitrah
        label: Niat dan doa (zakat fitrah)
        type: object
        list: true
        fields:
          - {name: judul, label: Judul, type: string}
          - {name: arab, label: Tulisan Arab, type: text}
          - {name: latin, label: Tulisan latin, type: text}
          - {name: arti, label: Arti, type: text}
