media:
  input: img
  output: /img
content:
  - name: umum
    label: Pengaturan Umum (nama, logo, tampilan)
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Nama lembaga
        type: string
      - name: lynk
        label: Link halaman Lynk
        type: string
      - name: logo
        label: Logo (kosongkan untuk ikon bawaan)
        type: image
      - name: showName
        label: Tampilkan nama di samping logo
        type: boolean
      - name: theme
        label: Tampilan (warna, huruf, ukuran tulisan)
        type: object
        fields:
          - name: palette
            label: Pilihan warna
            type: select
            options:
              values: [Hijau (bawaan), Biru, Ungu, Merah marun, Teal]
          - name: headingFont
            label: Huruf judul
            type: select
            options:
              values: [Bricolage Grotesque, Source Sans 3, Poppins, Montserrat, Nunito, Inter, Lora, Merriweather, Playfair Display]
          - name: bodyFont
            label: Huruf isi
            type: select
            options:
              values: [Bricolage Grotesque, Source Sans 3, Poppins, Montserrat, Nunito, Inter, Lora, Merriweather, Playfair Display]
          - name: textSize
            label: Ukuran tulisan
            type: select
            options:
              values: [Kecil, Normal, Besar, Sangat besar]
          - name: logoSize
            label: Ukuran logo di header
            type: select
            options:
              values: [Normal, Besar, Sangat besar]
          - name: pageWidth
            label: Lebar halaman
            type: select
            options:
              values: [Standar, Lebar, Sangat lebar]
          - name: aksen
            label: Pita hijau di atas halaman dalam (Program, Kalkulator, Kabar, Artikel, Profil)
            type: select
            options:
              values: [Hijau tua penuh, Mati]
          - name: forest
            label: "Warna utama gelap (opsional, contoh #0f3d2a)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #0f3d2a, atau kosongkan
          - name: leaf
            label: "Warna sekunder (opsional)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #2e8b57, atau kosongkan
          - name: sun
            label: "Warna tombol dan angka (opsional)"
            type: string
            pattern:
              regex: '^(|#[0-9a-fA-F]{6})$'
              message: Tulis kode warna seperti #f4b942, atau kosongkan
  - name: menu
    label: Menu dan Footer
    type: file
    path: data/menu.json
    format: json
    fields:
      - name: menu
        label: Menu di header
        type: object
        list: true
        fields:
          - {name: label, label: Nama menu, type: string}
          - {name: url, label: "Link (contoh news.html atau https://lynk.id/...), kosongkan jika punya dropdown", type: string}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
          - name: children
            label: Isi dropdown (opsional)
            type: object
            list: true
            fields:
              - {name: label, label: Nama, type: string}
              - {name: url, label: Link, type: string}
              - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
      - name: footer
        label: Footer (bagian bawah situs)
        type: object
        fields:
          - {name: description, label: Kalimat deskripsi (kosongkan untuk kalimat bawaan), type: text}
          - {name: quickTitle, label: Judul kolom tautan (contoh Tautan), type: string}
          - {name: donateText, label: Tulisan link donasi (contoh Donasi sekarang), type: string}
          - name: quick
            label: Tautan tambahan di footer
            type: object
            list: true
            fields:
              - {name: label, label: Nama tautan, type: string}
              - {name: url, label: "Link (news.html, about.html, atau https://...)", type: string}
              - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
          - {name: contactTitle, label: Judul kolom kontak (contoh Kontak), type: string}
          - {name: address, label: Alamat (boleh lebih dari satu baris), type: text}
          - {name: phone, label: Nomor telepon, type: string}
          - {name: email, label: Email, type: string}
          - {name: hours, label: Jam layanan (contoh Senin-Jumat 08.00-16.00), type: string}
          - {name: copyright, label: "Tulisan hak cipta (pakai {tahun} agar tahun otomatis)", type: string}
  - name: beranda
    label: Beranda (angka donasi)
    type: file
    path: data/beranda.json
    format: json
    fields:
      - name: stats
        label: Angka slideshow di beranda
        type: object
        list: true
        fields:
          - {name: label, label: Judul angka, type: string}
          - {name: value, label: Nilai (angka saja tanpa titik), type: number}
          - {name: money, label: Tampilkan sebagai Rupiah, type: boolean}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
  - name: slideshow
    label: Slideshow Beranda dan Tombol Donasi melayang
    type: file
    path: data/slideshow.json
    format: json
    fields:
      - {name: kecepatan, label: "Lama tiap slide (detik)", type: number}
      - {name: gerakOtomatis, label: Slideshow berganti otomatis, type: boolean, default: true}
      - name: ukuranAngka
        label: Ukuran angka donasi (angkanya diatur di entri Beranda)
        type: select
        options:
          values: [Kecil, Sedang, Besar, Sangat besar]
      - name: slides
        label: Slide manual (slide artikel muncul otomatis dari entri Artikel)
        type: object
        list: true
        fields:
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
          - name: jenis
            label: Jenis slide
            type: select
            options:
              values: [Biasa, Campaign]
          - {name: eyebrow, label: Tulisan kecil di atas judul, type: string}
          - {name: judul, label: Judul, type: string}
          - {name: kalimat, label: Kalimat, type: text}
          - {name: tombol, label: Tulisan tombol, type: string}
          - {name: link, label: "Link tombol (kosongkan = link Donasi umum). Halaman sendiri cukup ditulis seperti news.html", type: string}
          - {name: gambar, label: Gambar komputer (kosongkan = latar hijau), type: image}
          - {name: gambarHp, label: Gambar HP (opsional), type: image}
          - {name: terkumpul, label: Terkumpul (Rp, hanya untuk jenis Campaign), type: number}
          - {name: target, label: Target (Rp, hanya untuk jenis Campaign), type: number}
      - name: fab
        label: Tombol Donasi melayang
        type: object
        fields:
          - {name: tampil, label: Tampilkan tombol (matikan untuk menyembunyikan), type: boolean, default: true}
          - name: ikon
            label: Gambar ikon
            type: select
            options:
              values: [Hati, Tangan memberi, Koin Rp, Tanpa gambar]
          - {name: tulisanTampil, label: Tampilkan tulisan di tombol, type: boolean, default: true}
          - {name: tulisan, label: Tulisan di tombol (contoh Donasi), type: string}
          - name: posisi
            label: Posisi
            type: select
            options:
              values: [Kanan bawah, Kiri bawah]
          - {name: link, label: "Link tombol (kosongkan = link Donasi umum)", type: string}
  - name: artikel
    label: Artikel
    type: file
    path: data/artikel.json
    format: json
    fields:
      - {name: title, label: Judul halaman Artikel, type: string}
      - {name: intro, label: Kalimat pengantar halaman Artikel, type: text}
      - name: articles
        label: Daftar artikel
        type: object
        list: true
        fields:
          - {name: title, label: Judul, type: string}
          - {name: date, label: Tanggal, type: date}
          - {name: summary, label: Ringkasan singkat (tampil di kartu dan slide), type: text}
          - {name: image, label: Gambar, type: image}
          - {name: body, label: "Isi lengkap (pisahkan paragraf dengan baris kosong; awali baris dengan ## untuk sub judul)", type: text}
          - {name: tampilSlide, label: Tampilkan di slideshow beranda, type: boolean, default: false}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
  - name: berita
    label: Berita (Kabar)
    type: file
    path: data/berita.json
    format: json
    fields:
      - name: news
        label: Kabar
        type: object
        list: true
        fields:
          - {name: title, label: Judul, type: string}
          - {name: date, label: Tanggal, type: date}
          - {name: summary, label: Ringkasan singkat (tampil di kartu), type: text}
          - {name: image, label: Foto, type: image}
          - {name: body, label: Isi lengkap (pisahkan paragraf dengan baris kosong), type: text}
          - {name: source, label: Nama sumber (opsional), type: string}
          - {name: sourceUrl, label: Link berita asli (opsional), type: string}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
  - name: program
    label: Program (Donasi, Zakat, Sedekah, Wakaf)
    type: file
    path: data/program.json
    format: json
    fields:
      - {name: title, label: Judul halaman dan bagian beranda (contoh Program Kami), type: string}
      - {name: intro, label: Kalimat pembuka halaman (opsional), type: text}
      - {name: donasiTampil, label: Tampilkan kategori Donasi, type: boolean, default: true}
      - {name: donasiDesc, label: Deskripsi Donasi (kosongkan untuk teks bawaan), type: text}
      - {name: donasiIcon, label: Ikon Donasi (opsional), type: image}
      - {name: zakatTampil, label: Tampilkan kategori Zakat, type: boolean, default: true}
      - {name: zakatDesc, label: Deskripsi Zakat (kosongkan untuk teks bawaan), type: text}
      - {name: zakatIcon, label: Ikon Zakat (opsional), type: image}
      - {name: sedekahTampil, label: Tampilkan kategori Sedekah, type: boolean, default: true}
      - {name: sedekahDesc, label: Deskripsi Sedekah (kosongkan untuk teks bawaan), type: text}
      - {name: sedekahIcon, label: Ikon Sedekah (opsional), type: image}
      - {name: wakafTampil, label: Tampilkan kategori Wakaf, type: boolean, default: true}
      - {name: wakafDesc, label: Deskripsi Wakaf (kosongkan untuk teks bawaan), type: text}
      - {name: wakafIcon, label: Ikon Wakaf (opsional), type: image}
      - name: cards
        label: Kartu program (gambar, judul, link Lynk)
        type: object
        list: true
        fields:
          - name: category
            label: Kategori
            type: select
            options:
              values: [Donasi, Zakat, Sedekah, Wakaf]
          - {name: title, label: Judul kartu, type: string}
          - {name: image, label: Gambar, type: image}
          - {name: url, label: Link kampanye di Lynk, type: string}
          - {name: tracker, label: Tampilkan tracker goal (bar progres donasi), type: boolean, default: false}
          - {name: terkumpul, label: Terkumpul (Rp, dipakai jika tracker menyala), type: number}
          - {name: target, label: Target (Rp, dipakai jika tracker menyala), type: number}
          - {name: slide, label: Tampilkan di slideshow beranda (tracker ikut tampil jika menyala), type: boolean, default: false}
          - {name: kalimatSlide, label: Kalimat untuk slide (hanya dipakai di slideshow), type: text}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
  - name: profil
    label: Profil
    type: file
    path: data/profil.json
    format: json
    fields:
      - {name: title, label: Judul halaman, type: string}
      - {name: intro, label: Kalimat pembuka (opsional), type: text}
      - name: sections
        label: Bagian profil
        type: object
        list: true
        fields:
          - {name: heading, label: Judul bagian, type: string}
          - {name: text, label: Isi (pisahkan paragraf dengan baris kosong), type: text}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
      - {name: linksTitle, label: Judul bagian tautan (contoh Hubungi kami), type: string}
      - name: links
        label: Tautan WhatsApp, Instagram, dll
        type: object
        list: true
        fields:
          - name: type
            label: Jenis
            type: select
            options:
              values: [WhatsApp, Instagram, Lainnya]
          - {name: label, label: Teks tombol (opsional), type: string}
          - {name: url, label: "Nomor WA (08xxx), @username Instagram, atau link lengkap", type: string}
          - {name: tampil, label: Tampilkan (matikan untuk menyembunyikan), type: boolean, default: true}
  - name: kalkulator
    label: Kalkulator Zakat (harga, tautan, doa)
    type: file
    path: data/kalkulator.json
    format: json
    fields:
      - name: judul
        label: Judul halaman
        type: string
      - name: intro
        label: Kalimat pembuka
        type: text
      - name: hargaEmas
        label: Harga emas per gram (angka saja, tanpa titik)
        type: number
      - name: hargaPerak
        label: Harga perak per gram (angka saja)
        type: number
      - name: hargaGabah
        label: Harga gabah per kg (angka saja, untuk nisab pertanian)
        type: number
      - name: hargaBeras
        label: Harga beras per kg (angka saja, untuk zakat fitrah)
        type: number
      - name: tanggalHarga
        label: Keterangan tanggal harga (contoh Diperbarui 17 November 2026)
        type: string
      - name: tombol
        label: Tulisan tombol (contoh Tunaikan Zakat)
        type: string
      - name: linkUmum
        label: Link umum tombol (kosongkan untuk memakai link Lynk utama)
        type: string
      - name: links
        label: Link Lynk untuk tiap jenis zakat (kosong = pakai link umum)
        type: object
        fields:
          - {name: emas, label: Zakat Emas, type: string}
          - {name: perak, label: Zakat Perak, type: string}
          - {name: uang, label: Zakat Uang, type: string}
          - {name: surat, label: Zakat Surat Berharga, type: string}
          - {name: niaga, label: Zakat Perniagaan, type: string}
          - {name: ikan, label: Zakat Perikanan, type: string}
          - {name: tambang, label: Zakat Pertambangan, type: string}
          - {name: perusahaan, label: Zakat Perusahaan, type: string}
          - {name: hasil, label: Zakat Penghasilan, type: string}
          - {name: tani, label: Zakat Pertanian, type: string}
          - {name: ternak, label: Zakat Peternakan, type: string}
          - {name: fitrah, label: Zakat Fitrah, type: string}
      - name: aktif
        label: Jenis zakat yang ditampilkan (matikan untuk menyembunyikan)
        type: object
        fields:
          - {name: emas, label: Tampilkan Zakat Emas, type: boolean, default: true}
          - {name: perak, label: Tampilkan Zakat Perak, type: boolean, default: true}
          - {name: uang, label: Tampilkan Zakat Uang, type: boolean, default: true}
          - {name: surat, label: Tampilkan Zakat Surat Berharga, type: boolean, default: true}
          - {name: niaga, label: Tampilkan Zakat Perniagaan, type: boolean, default: true}
          - {name: ikan, label: Tampilkan Zakat Perikanan, type: boolean, default: true}
          - {name: tambang, label: Tampilkan Zakat Pertambangan, type: boolean, default: true}
          - {name: perusahaan, label: Tampilkan Zakat Perusahaan, type: boolean, default: true}
          - {name: hasil, label: Tampilkan Zakat Penghasilan, type: boolean, default: true}
          - {name: tani, label: Tampilkan Zakat Pertanian, type: boolean, default: true}
          - {name: ternak, label: Tampilkan Zakat Peternakan, type: boolean, default: true}
          - {name: fitrah, label: Tampilkan Zakat Fitrah, type: boolean, default: true}
      - name: catatan
        label: Catatan di bawah kalkulator
        type: text
      - name: doaMaal
        label: Niat dan doa (zakat selain fitrah)
        type: object
        list: true
        fields:
          - {name: judul, label: Judul, type: string}
          - {name: arab, label: Tulisan Arab, type: text}
          - {name: latin, label: Tulisan latin, type: text}
          - {name: arti, label: Arti, type: text}
      - name: doaFitrah
        label: Niat dan doa (zakat fitrah)
        type: object
        list: true
        fields:
          - {name: judul, label: Judul, type: string}
          - {name: arab, label: Tulisan Arab, type: text}
          - {name: latin, label: Tulisan latin, type: text}
          - {name: arti, label: Arti, type: text}
